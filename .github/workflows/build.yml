# Builds the exe and the installer on every push to main. A tag like v1.0.1 also publishes a GitHub release.
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      - name: Version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          "VERSION=$($env:GITHUB_REF_NAME.Substring(1))" >> $env:GITHUB_ENV

      - name: Compile
        shell: cmd
        run: compile.bat %VERSION%

      - uses: actions/upload-artifact@v4
        with:
          name: poe2verlay
          path: dist/*.exe

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME "dist/poe2verlay-setup-$env:VERSION.exe" dist/poe2verlay.exe `
            --repo $env:GITHUB_REPOSITORY --title "poe2verlay $env:VERSION" --notes-file .github/release-notes.md
